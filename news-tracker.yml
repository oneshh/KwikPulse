name: Daily News Tracker

on:
  schedule:
    - cron: '17 3 * * *'   # 08:47 IST daily (UTC schedule)
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Create a controlled test failure and alert'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: news-tracker
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Collect news
        env:
          SIMULATE_EMPTY: ${{ inputs.simulate_failure == true && '1' || '0' }}
        run: python collector.py
      - name: Commit updated historical data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/articles.json docs/data/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily article history'
            git push
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Alert on failed or empty run
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title='KwikPulse news tracker failed'
          existing=$(gh issue list --state open --limit 100 --json title --jq ".[] | select(.title == \"$title\") | .title")
          if [ -z "$existing" ]; then
            gh issue create --title "$title" --body "The daily news tracker failed or returned no usable articles. See workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          else
            echo 'An open failure issue already exists; suppressing duplicate alert.'
          fi
